<details
  *transloco="let t"
  class="group rounded-lg border border-line bg-surface"
  [open]="open()"
  (toggle)="toggle($any($event.target).open)"
>
  <summary
    class="flex cursor-pointer items-center gap-sm px-md py-sm text-body-sm text-ink-muted transition-colors hover:text-ink"
    [attr.aria-label]="open() ? t('workspace.research.collapse') : t('workspace.research.expand')"
  >
    @if (live()) {
      <span class="size-1.5 animate-pulse rounded-full bg-primary" aria-hidden="true"></span>
      {{ t('workspace.research.searching') }}
    } @else {
      <ui-icon name="file-text" [size]="14" />
      {{ t('workspace.research.done', { count: entries().length }) }}
    }
    <ui-icon
      name="chevron-down"
      [size]="16"
      class="ml-auto shrink-0 transition-transform duration-200 group-open:rotate-180"
    />
  </summary>

  <ul class="flex flex-col gap-md border-t border-line px-md py-md">
    @for (entry of entries(); track $index) {
      <li class="trace-in flex gap-sm">
        <ui-icon name="zap" [size]="14" class="mt-[3px] shrink-0 text-ink-subtle" />

        <div class="min-w-0">
          <p class="truncate text-body-sm font-medium text-ink">{{ label(entry.name) }}</p>
          @if (entry.result) {
            <p class="mt-xs text-body-sm leading-relaxed text-ink-muted">{{ entry.result }}</p>
          }
        </div>
      </li>
    }
  </ul>
</details>
