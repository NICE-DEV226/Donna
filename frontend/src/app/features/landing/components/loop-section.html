<section *transloco="let t" id="how" class="scroll-mt-20 py-xxl">
  <div class="mx-auto grid max-w-page items-center gap-xl px-lg lg:grid-cols-2 lg:gap-xxl">
    <div uiReveal>
      <p class="mb-md text-label-caps text-primary">{{ t('loop.eyebrow') }}</p>
      <h2 class="text-mobile-headline text-ink sm:text-headline-lg lg:text-display">
        {{ t('loop.title') }}
      </h2>
      <p class="mt-lg max-w-measure text-body-lg text-ink-muted">{{ t('loop.body') }}</p>

      <ul class="mt-xl flex flex-col">
        @for (point of points; track point; let last = $last) {
          <li
            class="flex items-start gap-md py-md"
            [class.border-b]="!last"
            [class.border-line]="!last"
          >
            <ui-icon name="circle-check" [size]="20" class="mt-[2px] text-success" />
            <span class="text-body-md text-ink-muted">{{ t(point) }}</span>
          </li>
        }
      </ul>
    </div>

    <div [uiReveal]="120">
      <conversation-preview />
    </div>
  </div>
</section>
