<div *transloco="let t" class="grid min-h-screen lg:grid-cols-2">
  <!-- Colonne formulaire -->
  <div class="flex flex-col px-lg py-lg">
    <div class="flex items-center justify-between gap-md">
      <a
        routerLink="/"
        class="inline-flex items-center gap-sm text-body-sm text-ink-muted transition-colors hover:text-primary"
      >
        <ui-icon name="arrow-left" [size]="16" />
        {{ t('auth.back') }}
      </a>
      <language-switch />
    </div>

    <div class="mx-auto flex w-full max-w-form grow flex-col justify-center py-xl">
      <ng-content />
    </div>

    <p class="mx-auto w-full max-w-form text-body-sm text-ink-subtle">
      © {{ year }} {{ t('footer.rights') }}
    </p>
  </div>

  <!-- Colonne éditoriale : couche tonale en creux, séparée par un simple filet -->
  <aside class="hidden border-l border-line bg-surface-sunken lg:flex lg:flex-col lg:justify-center">
    <div class="mx-auto flex w-full max-w-aside flex-col gap-xl px-xl py-xxl">
      <div>
        <p class="mb-md text-label-caps uppercase text-primary">{{ t('auth.aside.eyebrow') }}</p>
        <p class="text-headline-md text-ink">{{ t('auth.aside.title') }}</p>
      </div>

      <conversation-preview />

      <ul class="flex flex-col">
        @for (point of trustPoints; track point.key; let last = $last) {
          <li
            class="flex items-start gap-md py-md"
            [class.border-b]="!last"
            [class.border-line]="!last"
          >
            <ui-icon [name]="point.icon" [size]="20" class="mt-[2px] text-success" />
            <span class="text-body-sm text-ink-muted">{{ t(point.key) }}</span>
          </li>
        }
      </ul>
    </div>
  </aside>
</div>
