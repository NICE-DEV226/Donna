<auth-layout>
  <ng-container *transloco="let t">
    <h1 class="text-headline-lg text-ink">{{ t('auth.login.title') }}</h1>
    <p class="mt-sm text-body-md text-ink-muted">{{ t('auth.login.subtitle') }}</p>

    <div class="mt-xl">
      <oauth-block labelKey="auth.login.google" (authenticate)="signInWithGoogle()" />
    </div>

    <form [formGroup]="form" (ngSubmit)="submit()" novalidate class="flex flex-col gap-md">
      <ui-field
        [label]="t('auth.fields.email')"
        controlId="email"
        [control]="form.controls.email"
        [messages]="{
          required: t('auth.fields.required'),
          email: t('auth.fields.emailInvalid'),
        }"
      >
        <input
          uiInput
          id="email"
          type="email"
          formControlName="email"
          autocomplete="email"
          [placeholder]="t('auth.fields.emailPlaceholder')"
          aria-describedby="email-description"
        />
      </ui-field>

      <password-field
        [control]="form.controls.password"
        autocomplete="current-password"
        [messages]="{ required: t('auth.fields.required') }"
      />

      <a
        routerLink="/forgot-password"
        class="-mt-xs self-end text-body-sm text-ink-muted transition-colors hover:text-primary"
      >
        {{ t('auth.login.forgot') }}
      </a>

      @if (error()) {
        <p class="text-body-sm text-danger" role="alert">{{ t(error()!) }}</p>
      }

      <button type="submit" uiButton="secondary" class="mt-sm w-full" [disabled]="pending()">
        @if (pending()) {
          <ui-icon name="loader-circle" [size]="18" class="animate-spin" />
          {{ t('auth.login.submitting') }}
        } @else {
          {{ t('auth.login.submit') }}
        }
      </button>
    </form>

    <p class="mt-xl text-body-sm text-ink-muted">
      {{ t('auth.login.newHere') }}
      <a routerLink="/signup" class="font-semibold text-primary hover:underline">
        {{ t('auth.login.createAccount') }}
      </a>
    </p>
  </ng-container>
</auth-layout>
