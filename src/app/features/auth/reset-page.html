<auth-layout>
  <ng-container *transloco="let t">
    @if (sentTo(); as email) {
      <h1 class="text-headline-lg text-ink">{{ t('auth.reset.sentTitle') }}</h1>
      <p class="mt-sm text-body-md text-ink-muted">{{ t('auth.reset.sentBody', { email }) }}</p>

      <div class="mt-xl flex flex-wrap gap-md">
        <a routerLink="/login" uiButton="secondary">{{ t('auth.reset.back') }}</a>
        <button type="button" uiButton="ghost" (click)="resend()">
          {{ t('auth.reset.resend') }}
        </button>
      </div>
    } @else {
      <h1 class="text-headline-lg text-ink">{{ t('auth.reset.title') }}</h1>
      <p class="mt-sm text-body-md text-ink-muted">{{ t('auth.reset.subtitle') }}</p>

      <form [formGroup]="form" (ngSubmit)="submit()" novalidate class="mt-xl flex flex-col gap-md">
        <ui-field
          [label]="t('auth.fields.email')"
          controlId="email"
          [control]="form.controls.email"
          [messages]="{
            required: t('auth.fields.required'),
            email: t('auth.fields.emailInvalid'),
          }"
        >
          <input
            uiInput
            id="email"
            type="email"
            formControlName="email"
            autocomplete="email"
            [placeholder]="t('auth.fields.emailPlaceholder')"
            aria-describedby="email-description"
          />
        </ui-field>

        <button type="submit" uiButton class="mt-sm w-full" [disabled]="pending()">
          @if (pending()) {
            <ui-icon name="loader-circle" [size]="18" class="animate-spin" />
            {{ t('auth.reset.sending') }}
          } @else {
            {{ t('auth.reset.submit') }}
          }
        </button>
      </form>

      <p class="mt-xl text-body-sm text-ink-muted">
        <a routerLink="/login" class="font-semibold text-primary hover:underline">
          {{ t('auth.reset.back') }}
        </a>
      </p>
    }
  </ng-container>
</auth-layout>
