[project]
name = "backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Eliezer Traore", email = "68350805+traoreera@users.noreply.github.com" }
]
requires-python = ">=3.14"
dependencies = [
    "xcdk>=0.1.0",
    "xcorecli>=2.2.0",
    "xcoreruntime>=2.5.2",
    "pydantic[email]>=2.13.4",
    "python-jose>=3.5.0",
    "cryptography>=50.0.1",
    "anthropic>=0.40.0",
    "openai>=1.0",
    "aiomqtt>=2.0",
    "mcp>=1.0",
    "sqlite-vec",
    "faster-whisper",
    "aiosmtplib",
    "passlib[argon2]>=1.7.4",
    "pyotp>=2.10.0",
    "pypdf>=6.0",
    "python-docx>=1.2.0",
    "openpyxl>=3.1.5",
    "python-pptx>=1.0.2",
    "transformers>=5.0",
]

[project.scripts]
backend = "backend:main"

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"
