format_version: '1'
project_id: prj_7a3081dfd98cbc70372db35453f848d8
version: 0.1.0
steps:
- id: prepare
  action: prepare
- id: install_xauth
  action: install_plugin
  plugin: xauth
  snapshot: true
- id: install_chat
  action: install_plugin
  plugin: chat
  snapshot: true
- id: install_rag
  action: install_plugin
  plugin: rag
  snapshot: true
- id: install_xpulses
  action: install_plugin
  plugin: xpulses
  snapshot: true
- id: install_ext_rag
  action: install_extension
  extension: rag
  snapshot: true
- id: install_ext_extxstorage
  action: install_extension
  extension: extxstorage
  snapshot: true
- id: install_ext_xmailler
  action: install_extension
  extension: xmailler
  snapshot: true
- id: install_ext_extpubsub
  action: install_extension
  extension: extpubsub
  snapshot: true
- id: install_ext_xwebsocket
  action: install_extension
  extension: xwebsocket
  snapshot: true
- id: install_ext_mcp_bridge
  action: install_extension
  extension: mcp_bridge
  snapshot: true
- id: start
  action: start
  depends_on:
  - install_xauth
  - install_chat
  - install_rag
  - install_xpulses
  - install_ext_rag
  - install_ext_extxstorage
  - install_ext_xmailler
  - install_ext_extpubsub
  - install_ext_xwebsocket
  - install_ext_mcp_bridge
- id: healthcheck
  action: healthcheck
  depends_on:
  - start
  timeout: 30s
  retries: 3
